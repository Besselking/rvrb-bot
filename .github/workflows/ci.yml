name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# A second push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "27.3"

jobs:
  test:
    runs-on: ubuntu-latest

    # mix test boots the app, which starts Rvrb.Repo - so the suite needs a
    # real Postgres to connect to, not just a compiled schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # config/config.exs unconditionally imports config/test.secret.exs for
      # dev/test, and that file is gitignored (real deploys supply real
      # secrets). Mix fails on *every* command without it - including
      # local.hex - so the stand-in has to be written before anything else.
      - name: Write the test secrets stand-in
        run: |
          cat > config/test.secret.exs << 'EOF'
          import Config

          config :rvrb, bot_token: "test-bot-token"

          config :rvrb, Rvrb.Repo,
            username: "postgres",
            password: "postgres"
          EOF

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      # Deps compile with their own settings, so the vendored fresh's type
      # warnings stay warnings - only rvrb's own code fails the build here.
      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

      - run: mix test
