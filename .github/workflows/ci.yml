name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

# A second push to the same branch makes the in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "27.3"

jobs:
  test:
    runs-on: ubuntu-latest

    # mix test boots the app, which starts Rvrb.Repo - so the suite needs a
    # real Postgres to connect to, not just a compiled schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # config/config.exs unconditionally imports config/test.secret.exs for
      # dev/test, and that file is gitignored (real deploys supply real
      # secrets). Mix fails on *every* command without it, and setup-beam runs
      # mix local.hex and mix local.rebar from this directory as part of its
      # own setup - so the stand-in has to be written before setup-beam, not
      # just before our first mix step.
      - name: Write the test secrets stand-in
        run: |
          cat > config/test.secret.exs << 'EOF'
          import Config

          config :rvrb, bot_token: "test-bot-token"

          config :rvrb, Rvrb.Repo,
            username: "postgres",
            password: "postgres"
          EOF

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get

      # Deps compile with their own settings, so the vendored fresh's type
      # warnings stay warnings - only rvrb's own code fails the build here.
      - run: mix compile --warnings-as-errors

      - run: mix format --check-formatted

      # `mix compile` above only covers `lib` and `test/support` (see
      # `elixirc_paths/1` in mix.exs), so warnings in the test files
      # themselves reach nobody. `mix test` compiles those, and the flag
      # makes them fail the build the same way.
      - run: mix test --warnings-as-errors
  # Nothing else here looks at flake.nix, so an upstream nixpkgs change -
  # the mix builders dropping their `elixir` argument, say - otherwise
  # surfaces on somebody's deploy rather than in CI. Evaluating is enough
  # to catch that: the builders assert on their arguments at eval time, and
  # forcing a drvPath is seconds rather than a full release build.
  flake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # Runners are x86_64-linux, hence the explicit system - `nix eval`
      # wants a concrete attribute path, and this only has to cover the
      # platform the release is actually built for. No build cache here:
      # forcing a drvPath builds nothing to cache.
      - name: Evaluate the flake outputs
        run: |
          set -euo pipefail
          for attr in \
            packages.x86_64-linux.default \
            packages.x86_64-linux.mixFodDeps \
            devShells.x86_64-linux.default
          do
            echo "==> $attr"
            nix eval --raw ".#$attr.drvPath"
            echo
          done
